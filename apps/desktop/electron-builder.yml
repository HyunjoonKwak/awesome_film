appId: dev.cuteditor.app
productName: cut_editor
copyright: Copyright © 2026 cut_editor contributors

directories:
  output: dist
  buildResources: build

# Include the Electron shell sources + the static-exported web app produced
# by `pnpm run build:web` at apps/web/out.
files:
  - "src/**/*"
  - "package.json"
extraResources:
  - from: "../web/out"
    to: "web"
    filter: ["**/*"]

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: "build/icon.png"
  hardenedRuntime: true
  gatekeeperAssess: false
  # Code signing is intentionally left to the developer's local environment:
  #   export CSC_LINK=... CSC_KEY_PASSWORD=...
  #   export APPLE_ID=... APPLE_APP_SPECIFIC_PASSWORD=... APPLE_TEAM_ID=...
  # electron-builder picks these up automatically.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
